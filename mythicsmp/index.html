<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đang bảo trì</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            /* Sử dụng Flexbox để căn giữa nội dung */
            display: flex;
            justify-content: center;
            align-items: center;
            
            /* Nền đen chủ đạo */
            background-color: #050505;
            
            /* Tạo hiệu ứng loang (mottled/gradient) đỏ và vàng */
            background-image: 
                radial-gradient(circle at 25% 25%, rgba(139, 0, 0, 0.4) 0%, transparent 40%),
                radial-gradient(circle at 75% 75%, rgba(184, 134, 11, 0.25) 0%, transparent 45%),
                radial-gradient(circle at 50% 80%, rgba(100, 0, 0, 0.3) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(200, 20, 20, 0.15) 0%, transparent 35%);
            
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }

        .maintenance-text {
            color: #ff2a2a; /* Màu đỏ sáng để nổi bật trên nền tối */
            font-size: 4rem;
            font-weight: bold;
            text-transform: uppercase;
            text-align: center;
            /* Thêm bóng đổ để chữ có chiều sâu và không bị chìm vào nền */
            text-shadow: 0px 4px 15px rgba(255, 0, 0, 0.4), 2px 2px 5px rgba(0, 0, 0, 0.8);
            letter-spacing: 3px;
        }

        /* Responsive cho điện thoại */
        @media (max-width: 768px) {
            .maintenance-text {
                font-size: 2.5rem;
                padding: 0 20px;
            }
        }
    </style>
</head>
<body>
    <div class="maintenance-text">Hiện đang bảo trì</div>
</body>
</html>
